#!/bin/bash
# ============================================================
#  Unishield 360 Agent - Customer Build Configuration
#  Set the values below ONCE per customer, then build.
# ============================================================

# The Unishield 360 manager (collector) IP that agents will report to.
# Every agent in this package will connect to this address automatically.
MANAGER_IP="100.110.74.122"

# Optional: default agent name prefix (leave blank to use hostname)
# AGENT_NAME_PREFIX=""

# Optional: enrollment port (1515 default) and reporting port (1514 default)
MANAGER_PORT="1514"
ENROLLMENT_PORT="1515"
PROTOCOL="tcp"

# Package version / revision (change only when bumping versions)
VERSION="4.14.7"
REVISION="1"

# ============================================================
#  Windows code signing (optional)
#  Leave UNISHIELD_CERT_FILE empty to build unsigned.
#  Signing uses osslsigncode (cross-platform) and is wired into
#  the winagent build automatically when a certificate is set.
# ============================================================

# Path to your code signing certificate:
#   - PKCS#12 bundle:  /secure/path/code-signing.pfx  (use UNISHIELD_CERT_PASS)
#   - PEM:             /secure/path/cert.pem         (use UNISHIELD_CERT_KEY/PASS)
UNISHIELD_CERT_FILE=""

# Private key file (PEM only; ignored for .pfx/.p12)
UNISHIELD_CERT_KEY=""

# Password for the .pfx/.p12 or an encrypted PEM key
UNISHIELD_CERT_PASS=""

# RFC3161 timestamp server (keeps signature valid after cert expiry)
UNISHIELD_TIMESTAMP="http://timestamp.digicert.com"

# Root CA name used by Wazuh's own trust verification (IMAGE_TRUST_CHECKS).
# Must match the root CA of your signing certificate, e.g.:
#   "DigiCert Assured ID Root CA", "DigiCert Trusted Root G4", etc.
UNISHIELD_CA_NAME="DigiCert Assured ID Root CA"
