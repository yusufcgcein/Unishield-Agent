###################### UNISHIELD 360 - PRE-CONFIGURED METRICBEAT 8.10.4 ######################
#
# This Metricbeat is pre-configured for Unishield 360 / Wazuh deployments.
# Edit the two values marked <<CUSTOMER>> per customer, then build/package.

# ======================= Modules =======================
metricbeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# ======================= General =======================
tags: ["windows", "performance"]

# ======================= TEMPLATE SETTINGS =======================
setup.template.name: "metricbeat"
setup.template.pattern: "metricbeat-*"
setup.template.enabled: false
setup.ilm.enabled: false

# ======================= Output =======================
# <<CUSTOMER>> Point hosts at the customer's Logstash (Beats input, port 62041).
# SPL metric pipeline listens on 100.110.227.127:62041 (beats protocol).
output.logstash:
  hosts: ["100.110.227.127:62041"]
  loadbalance: false

# ======================= Processors =======================
processors:
  - add_host_metadata: ~

# ======================= Logging =======================
logging.level: info
logging.to_files: true
logging.files:
  path: C:/ProgramData/metricbeat/logs
  name: metricbeat
  keepfiles: 7
  permissions: 0644